name: DevOps Task Tracker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Check backend
        working-directory: backend
        run: node --check server.js

      - name: Build frontend Docker image
        run: docker build -t devops-frontend ./frontend

      - name: Build backend Docker image
        run: docker build -t devops-backend ./backend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag frontend image
        run: docker tag devops-frontend ghcr.io/${{ github.repository_owner }}/devops-frontend:latest

      - name: Push frontend image
        run: docker push ghcr.io/${{ github.repository_owner }}/devops-frontend:latest

      - name: Tag backend image
        run: docker tag devops-backend ghcr.io/${{ github.repository_owner }}/devops-backend:latest

      - name: Push backend image
        run: docker push ghcr.io/${{ github.repository_owner }}/devops-backend:latest
